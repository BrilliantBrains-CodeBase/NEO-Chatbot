<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Sample clinic page</title>
    <!-- Aggressive site CSS: the widget must look the same despite this (Shadow DOM isolation). -->
    <style>
      * { font-family: 'Comic Sans MS', cursive !important; color: red !important; }
      button { background: yellow !important; border: 5px solid lime !important; }
      div { padding: 20px !important; }
    </style>
  </head>
  <body>
    <h1>Sample clinic page</h1>
    <script>
      // ?clinic=neo-follicle loads that clinic's loader, default Neo Fertility.
      const clinic = new URLSearchParams(location.search).get('clinic') || 'neo-fertility';
      const s = document.createElement('script');
      s.src = '/' + clinic + '.js';
      document.body.appendChild(s);
    </script>
  </body>
</html>
