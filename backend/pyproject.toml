[project]
name = "neo-backend"
version = "0.1.0"
description = "Backend for the NEO Group chatbots (Arya, Navya, Diya) and NEO CRM"
requires-python = ">=3.12,<3.13"
dependencies = [
  # API
  "fastapi>=0.156",
  "uvicorn[standard]>=0.32",
  "pydantic>=2.9",
  "pydantic-settings>=2.6",
  # database and cache
  "asyncpg>=0.30",
  "pgvector>=0.3",
  "redis>=5.2",
  "arq>=0.26",
  # answer pipeline
  "langgraph>=0.2",
  # regular: rules, typos, input checks
  "rapidfuzz>=3.10",
  "phonenumbers>=8.13",
  "email-validator>=2.2",
  "dateparser>=1.2",
  # semantic and other ML (CPU only)
  "fastembed>=0.4",
  "numpy>=1.26",
  "scikit-learn>=1.5",
  # knowledge base PDFs
  "pypdf>=5.0",
  # LLM fallback and integrations (Groq, Gemini, Interakt) over plain HTTP
  "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "ruff>=0.8",
  "mypy>=1.13",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
# Libraries without type hints.
module = ["asyncpg", "asyncpg.*", "pgvector.*", "arq.*", "fastembed.*", "sklearn.*", "dateparser.*"]
ignore_missing_imports = true
